name: Build and Deploy Task API

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/task-api:latest .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/task-api:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Create SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/task-api-key.pem
          chmod 600 ~/.ssh/task-api-key.pem

      - name: Add EC2 to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Amazon Linux EC2
        run: |
          ssh -i ~/.ssh/task-api-key.pem ec2-user@${{ secrets.EC2_HOST }} << 'EOF'

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/task-api:latest

            docker stop task-api-container || true

            docker rm task-api-container || true

            docker run -d \
              --restart unless-stopped \
              -p 5000:5000 \
              --name task-api-container \
              ${{ secrets.DOCKERHUB_USERNAME }}/task-api:latest

            docker ps

          EOF